[project]
name = "aqua-self-pruning-network"
version = "0.1.0"
description = "From-scratch NumPy autodiff, masked Adam, and honest sparse inference"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<3",
    "scikit-learn>=1.3,<2",
    "matplotlib>=3.7,<4"
]

[tool.setuptools.packages.find]
include = ["engine*", "nn*", "optim*", "prune*", "data*", "train*"]
